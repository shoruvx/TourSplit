name: Build and Release TourSplit APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'TourSplit release update! Split the costs, keep the memories.'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK Asset
        id: prepare_asset
        run: |
          RAW_TAG="${{ github.event.inputs.version || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          OUTPUT_APK="build/app/outputs/flutter-apk/TourSplit-v${CLEAN_VER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUTPUT_APK"
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "tag_name=v${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TourSplit v${{ steps.prepare_asset.outputs.clean_version }}"
          tag_name: ${{ steps.prepare_asset.outputs.tag_name }}
          body: "${{ github.event.inputs.release_notes || 'TourSplit update: Split the costs, keep the memories! Enjoy the latest features and stability improvements.' }}"
          draft: false
          prerelease: false
          files: ${{ steps.prepare_asset.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
