<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TourSplit — Splash</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; font-family: Outfit, system-ui, sans-serif; }
  .stage { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; }
  .stack { display:flex; flex-direction:column; align-items:center; pointer-events:none; }
  .splash { width:380px; height:380px; }
  .tent-l { animation: settleL 1.2s cubic-bezier(.2,.9,.25,1) .1s both; }
  .tent-r { animation: settleR 1.2s cubic-bezier(.2,.9,.25,1) .1s both; }
  @keyframes settleL { 0%{transform:translateX(-38px);opacity:0} 40%{opacity:1} 100%{transform:translateX(0);opacity:1} }
  @keyframes settleR { 0%{transform:translateX(38px);opacity:0} 40%{opacity:1} 100%{transform:translateX(0);opacity:1} }
  .seam { animation: seamIn .5s ease-out 1.15s both; }
  @keyframes seamIn { 0%{opacity:0} 100%{opacity:1} }
  .warm-near { animation: warmPulse 5s ease-in-out 1.8s infinite; transform-origin: 170px 200px; }
  @keyframes warmPulse { 0%,100%{opacity:0;transform:scale(.9)} 50%{opacity:.55;transform:scale(1)} }
  .warm-far { animation: warmFar 5s ease-in-out 1.8s infinite; transform-origin: 256px 256px; }
  @keyframes warmFar { 0%,100%{opacity:0;transform:scale(.9)} 50%{opacity:.30;transform:scale(1)} }
  .wordmark { animation: wordIn .9s cubic-bezier(.2,.9,.25,1) 2.5s both; }
  @keyframes wordIn { 0%{opacity:0;transform:translateY(8px)} 100%{opacity:1;transform:translateY(0)} }
  .wordmark-block { margin-top:-8px; text-align:center; }
</style>
</head>
<body>
<div class="stage">
  <div class="stack">
    <div class="splash">
      <svg viewBox="0 0 512 512" width="100%" height="100%">
        <defs>
          <linearGradient id="litL" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#26C6B6"/>
            <stop offset="60%" stop-color="#0D9488"/>
            <stop offset="100%" stop-color="#0A7E74"/>
          </linearGradient>
          <linearGradient id="shadeR" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0A5F55"/>
            <stop offset="60%" stop-color="#004D40"/>
            <stop offset="100%" stop-color="#003830"/>
          </linearGradient>
          <radialGradient id="warmNear" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.95"/>
            <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#92400E" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="warmFar" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5"/>
            <stop offset="60%" stop-color="#B45309" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#78350F" stop-opacity="0"/>
          </radialGradient>
          <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
          </filter>
        </defs>
        <circle class="warm-far" cx="256" cy="256" r="230" fill="url(#warmFar)"/>
        <circle class="warm-near" cx="170" cy="200" r="170" fill="url(#warmNear)"/>
        <g filter="url(#softShadow)">
          <g class="tent-l"><path d="M256 96 C216 170, 150 310, 100 420 L244 420 C244 320, 250 200, 256 96 Z" fill="url(#litL)"/></g>
          <g class="tent-r"><path d="M256 96 C296 170, 362 310, 412 420 L268 420 C268 320, 262 200, 256 96 Z" fill="url(#shadeR)"/></g>
        </g>
        <path d="M256 96 C216 170, 150 310, 100 420 L244 420 C244 320, 250 200, 256 96 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>
        <path d="M256 96 C296 170, 362 310, 412 420 L268 420 C268 320, 262 200, 256 96 Z" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="2"/>
        <line class="seam" x1="256" y1="100" x2="256" y2="420" stroke="#000000" stroke-opacity="0.45" stroke-width="3"/>
      </svg>
    </div>
    <div class="wordmark-block">
      <div class="wordmark" style="font-size:24px;font-weight:600;letter-spacing:-0.01em;color:#F8FAFC;">Tour<span style="color:#0D9488;">Split</span></div>
      <div class="wordmark" style="font-size:12px;color:#64748B;margin-top:4px;letter-spacing:0.02em;">Split the costs, keep the memories</div>
    </div>
  </div>
</div>
</body>
</html>
